<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>6品サラダ単独レシピ＆チェックリスト</title>
  <style>
    :root {
      --bg: #f4f7f4;
      --card: #ffffff;
      --ink: #1f2922;
      --muted: #5c6b60;
      --accent: #2e7d32;
      --accent-soft: #e8f5e9;
      --border: #dce5de;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding: 12px;
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: sticky;
      top: 8px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .salad-btn {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.35;
    }
    .salad-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .current-banner {
      background: var(--accent-soft);
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .current-name {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 2px 0;
      color: var(--accent);
    }
    .current-desc {
      font-size: 12px;
      color: var(--ink);
      margin: 0;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .bar {
      height: 6px;
      background: #e3ece5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--accent);
    }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid #eef3ef;
    }
    .item:first-of-type { border-top: none; }
    .item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .item-label { flex: 1; font-size: 14px; }
    .item-sub { display: block; font-size: 12px; color: var(--muted); }
    .done { text-decoration: line-through; color: var(--muted); }
    .step-list {
      margin: 0;
      padding-left: 20px;
    }
    .step-list li {
      margin-bottom: 8px;
      font-size: 14px;
    }
    .step-list li:last-child { margin-bottom: 0; }
    .dressing-box {
      background: #f9fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-top">
        <h1 class="title">🥗 6品サラダ（1品ずつ単独モード）</h1>
        <button class="btn" id="resetBtn" type="button">この品をリセット</button>
      </div>
      <div class="progress-row">
        <span id="progressText">0 / 0 (0%)</span>
        <span id="syncStatus">単独保存</span>
      </div>
      <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
    </div>

    <div class="selector" id="saladSelector"></div>

    <div class="current-banner">
      <h2 class="current-name" id="currentName"></h2>
      <p class="current-desc" id="currentDesc"></p>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="recipe" type="button">📖 作り方・手順</button>
      <button class="tab" data-tab="shop" type="button">🛒 材料・買い出し</button>
      <button class="tab" data-tab="prep" type="button">⏱️ 段取り</button>
    </div>

    <div id="view-recipe"></div>
    <div id="view-shop" style="display:none;"></div>
    <div id="view-prep" style="display:none;"></div>
  </div>

      },

          { id: "p3", name: "温かいまま味付けして盛り付ける", sub: "冷める前にオイルと塩を絡めると味がなじみやすい" }
        ],
        steps: [
          "ブロッコリーは小房に分け、さつまいも（またはかぼちゃ）は一口大に切って水にくぐらせます。",
          "耐熱皿に並べてラップをかけ、電子レンジ（600W）で3〜4分、野菜が柔らかくなるまで加熱します（茹でてもOKです）。",
          "加熱ムラがある場合は追加で30秒ずつ加熱し、余分な水気があれば軽く切ります。",
          "熱いうちにオリーブオイル（大さじ1）と塩（小さじ1/4）を絡め、お好みでゆで卵と黒こしょうを添えます。"
        ],
        dressing: "温野菜の基本味付け：オリーブオイル 大さじ1 ／ 塩 小さじ1/4 ／ 黒こしょう 少々（ポン酢やごま油でも合います）"
      }
    ];

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            selectedId: parsed.selectedId || "s1",
            tab: parsed.tab || "recipe",
            checked: parsed.checked || {}
          };
        }
      } catch (e) {}
      return { selectedId: "s1", tab: "recipe", checked: {} };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getCurrentSalad() {
      return SALADS.find(s => s.id === state.selectedId) || SALADS[0];
    }

    function getCurrentItemIds(salad) {
      return [...salad.shop, ...salad.prep].map(item => `${salad.id}_${item.id}`);
    }

    function updateProgress() {
      const salad = getCurrentSalad();
      const ids = getCurrentItemIds(salad);
      const total = ids.length;
      const done = ids.filter(fullId => !!state.checked[fullId]).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressText").textContent = `${salad.shortLabel}：${done} / ${total} (${pct}%)`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function renderSelector() {
      const el = document.getElementById("saladSelector");
      el.innerHTML = SALADS.map(s => `
        <button class="salad-btn ${s.id === state.selectedId ? "active" : ""}" data-id="${s.id}" type="button">
          ${s.shortLabel}
        </button>
      `).join("");

      el.querySelectorAll(".salad-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedId = btn.getAttribute("data-id");
          saveState();
          renderAll();
        });
      });
    }

    function renderBanner(salad) {
      document.getElementById("currentName").textContent = salad.name;
      document.getElementById("currentDesc").textContent = salad.desc;
    }

    function renderRecipe(salad) {
      const el = document.getElementById("view-recipe");
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">作り方手順（${salad.shortLabel} 単独）</h3>
          <ol class="step-list">
            ${salad.steps.map(st => `<li>${st}</li>`).join("")}
          </ol>
          <div class="dressing-box">
            <strong>味付け・ドレッシング目安：</strong><br />
            ${salad.dressing}
          </div>
        </div>
      `;
    }

    function renderCheckList(containerId, title, items, salad) {
      const el = document.getElementById(containerId);
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">${title}（${salad.shortLabel}）</h3>
          ${items.map(item => {
            const fullId = `${salad.id}_${item.id}`;
            const checked = !!state.checked[fullId];
            return `
              <label class="item">
                <input type="checkbox" data-full-id="${fullId}" ${checked ? "checked" : ""} />
                <span class="item-label ${checked ? "done" : ""}">
                  ${item.name}
                  ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ""}
                </span>
              </label>
            `;
          }).join("")}
        </div>
      `;

      el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          const fullId = cb.getAttribute("data-full-id");
          state.checked[fullId] = cb.checked;
          saveState();
          const label = cb.nextElementSibling;
          if (label) label.classList.toggle("done", cb.checked);
          updateProgress();
        });
      });
    }

    function applyTab() {
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.getAttribute("data-tab") === state.tab);
      });
      document.getElementById("view-recipe").style.display = state.tab === "recipe" ? "" : "none";
      document.getElementById("view-shop").style.display = state.tab === "shop" ? "" : "none";
      document.getElementById("view-prep").style.display = state.tab === "prep" ? "" : "none";
    }

    function renderAll() {
      const salad = getCurrentSalad();
      renderSelector();
      renderBanner(salad);
      renderRecipe(salad);
      renderCheckList("view-shop", "この1品に必要な材料・買い出し", salad.shop, salad);
      renderCheckList("view-prep", "この1品を作るときの段取り", salad.prep, salad);
      applyTab();
      updateProgress();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.tab = tab.getAttribute("data-tab");
        saveState();
        applyTab();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      const salad = getCurrentSalad();
      if (confirm(`${salad.shortLabel} のチェックだけをリセットしますか？`)) {
        for (const fullId of getCurrentItemIds(salad)) {
          delete state.checked[fullId];
        }
        saveState();
        renderAll();
      }
    });

    renderAll();
  </script>
</body>
</html>
