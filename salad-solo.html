<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サラダ6品・単独レシピ＆統合買い出しリスト</title>
  <style>
    :root {
      --bg: #f4f7f4;
      --card: #ffffff;
      --ink: #1f2922;
      --muted: #5c6b60;
      --accent: #2e7d32;
      --accent-soft: #e8f5e9;
      --border: #dce5de;
      --yt: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding: 12px;
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: sticky;
      top: 8px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 9px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .item-btn {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.35;
    }
    .item-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .current-banner {
      background: var(--accent-soft);
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .current-name {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: var(--accent);
    }
    .current-desc {
      font-size: 12px;
      color: var(--ink);
      margin: 0 0 8px 0;
    }
    .yt-btn {
      display: inline-block;
      background: var(--yt);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .bar {
      height: 6px;
      background: #e3ece5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--accent);
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid #eef3ef;
    }
    .check-item:first-of-type { border-top: none; }
    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .item-label { flex: 1; font-size: 14px; }
    .item-sub { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 4px;
    }
    .tag {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #c8e6c9;
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    .done { text-decoration: line-through; color: var(--muted); }
    .step-list {
      margin: 0;
      padding-left: 20px;
    }
    .step-list li {
      margin-bottom: 10px;
      font-size: 14px;
    }
    .step-list li:last-child { margin-bottom: 0; }
    .memo-box {
      background: #f9fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>

        memo: "タレ配合：酢 大さじ1／醤油 大さじ1／砂糖 大さじ1／ごま油 小さじ1／ごま 小さじ1。"
      }
    ];

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            selectedId: parsed.selectedId || "r1",
            tab: parsed.tab || "recipe",
            checked: parsed.checked || {}
          };
        }
      } catch (e) {}
      return { selectedId: "r1", tab: "recipe", checked: {} };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getCurrentRecipe() {
      return RECIPES.find(r => r.id === state.selectedId) || RECIPES[0];
    }

    function getAllShopIds() {
      const ids = [];
      for (const cat of SHOPPING_CATEGORIES) {
        for (const item of cat.items) {
          ids.push(`shop_${item.id}`);
        }
      }
      return ids;
    }

    function getCurrentPrepIds(recipe) {
      return recipe.prep.map(item => `${recipe.id}_${item.id}`);
    }

    function updateProgress() {
      if (state.tab === "shop") {
        const ids = getAllShopIds();
        const total = ids.length;
        const done = ids.filter(id => !!state.checked[id]).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        document.getElementById("progressText").textContent = `買い出し全体：${done} / ${total} (${pct}%)`;
        document.getElementById("progressBar").style.width = `${pct}%`;
        document.getElementById("resetBtn").textContent = "買い出しをリセット";
      } else {
        const recipe = getCurrentRecipe();
        const ids = getCurrentPrepIds(recipe);
        const total = ids.length;
        const done = ids.filter(id => !!state.checked[id]).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        document.getElementById("progressText").textContent = `${recipe.shortLabel} 段取り：${done} / ${total} (${pct}%)`;
        document.getElementById("progressBar").style.width = `${pct}%`;
        document.getElementById("resetBtn").textContent = "この品の段取りをリセット";
      }
    }

    function renderSelector() {
      const el = document.getElementById("recipeSelector");
      el.innerHTML = RECIPES.map(r => `
        <button class="item-btn ${r.id === state.selectedId ? "active" : ""}" data-id="${r.id}" type="button">
          ${r.shortLabel}
        </button>
      `).join("");

      el.querySelectorAll(".item-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedId = btn.getAttribute("data-id");
          saveState();
          renderAll();
        });
      });
    }

    function renderBanner(recipe) {
      document.getElementById("currentName").textContent = recipe.name;
      document.getElementById("currentDesc").textContent = recipe.desc;
      document.getElementById("ytLink").href = recipe.ytUrl;
    }

    function renderRecipe(recipe) {
      const el = document.getElementById("view-recipe");
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">作り方手順（${recipe.shortLabel}）</h3>
          <ol class="step-list">
            ${recipe.steps.map(st => `<li>${st}</li>`).join("")}
          </ol>
          <div class="memo-box">
            <strong>味付け・調理メモ：</strong><br />
            ${recipe.memo}
          </div>
          <div style="margin-top:12px;">
            <a class="yt-btn" href="${recipe.ytUrl}" target="_blank" rel="noopener">▶ このレシピのYouTube動画を開く</a>
          </div>
        </div>
      `;
    }

    function renderPrep(recipe) {
      const el = document.getElementById("view-prep");
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">この1品を作るときの段取り（${recipe.shortLabel}）</h3>
          ${recipe.prep.map(item => {
            const fullId = `${recipe.id}_${item.id}`;
            const checked = !!state.checked[fullId];
            return `
              <label class="check-item">
                <input type="checkbox" data-full-id="${fullId}" ${checked ? "checked" : ""} />
                <span class="item-label ${checked ? "done" : ""}">
                  ${item.name}
                  ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ""}
                </span>
              </label>
            `;
          }).join("")}
        </div>
      `;

      el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          const fullId = cb.getAttribute("data-full-id");
          state.checked[fullId] = cb.checked;
          saveState();
          const label = cb.nextElementSibling;
          if (label) label.classList.toggle("done", cb.checked);
          updateProgress();
        });
      });
    }

    function renderShop() {
      const el = document.getElementById("view-shop");
      el.innerHTML = SHOPPING_CATEGORIES.map(cat => `
        <div class="section">
          <h3 class="section-title">${cat.title}</h3>
          ${cat.items.map(item => {
            const fullId = `shop_${item.id}`;
            const checked = !!state.checked[fullId];
            const tagsHtml = (item.tags || []).map(t => `<span class="tag">${t}</span>`).join("");
            return `
              <label class="check-item">
                <input type="checkbox" data-full-id="${fullId}" ${checked ? "checked" : ""} />
                <span class="item-label ${checked ? "done" : ""}">
                  ${item.name}
                  ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ""}
                  ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
                </span>
              </label>
            `;
          }).join("")}
        </div>
      `).join("");

      el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          const fullId = cb.getAttribute("data-full-id");
          state.checked[fullId] = cb.checked;
          saveState();
          const label = cb.nextElementSibling;
          if (label) label.classList.toggle("done", cb.checked);
          updateProgress();
        });
      });
    }

    function applyTab() {
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.getAttribute("data-tab") === state.tab);
      });
      const isShop = state.tab === "shop";
      document.getElementById("solo-controls").style.display = isShop ? "none" : "";
      document.getElementById("view-recipe").style.display = state.tab === "recipe" ? "" : "none";
      document.getElementById("view-prep").style.display = state.tab === "prep" ? "" : "none";
      document.getElementById("view-shop").style.display = isShop ? "" : "none";
      updateProgress();
    }

    function renderAll() {
      const recipe = getCurrentRecipe();
      renderSelector();
      renderBanner(recipe);
      renderRecipe(recipe);
      renderPrep(recipe);
      renderShop();
      applyTab();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.tab = tab.getAttribute("data-tab");
        saveState();
        applyTab();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (state.tab === "shop") {
        if (confirm("買い出しリストのチェックをすべてリセットしますか？")) {
          for (const id of getAllShopIds()) {
            delete state.checked[id];
          }
          saveState();
          renderAll();
        }
      } else {
        const recipe = getCurrentRecipe();
        if (confirm(`${recipe.shortLabel} の段取りチェックだけをリセットしますか？`)) {
          for (const id of getCurrentPrepIds(recipe)) {
            delete state.checked[id];
          }
          saveState();
          renderAll();
        }
      }
    });

    renderAll();
  </script>
</body>
</html>
