<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>サラダ6品・単独レシピ＆チェックリスト</title>
  <style>
    :root {
      --bg: #f4f7f4;
      --card: #ffffff;
      --ink: #1f2922;
      --muted: #5c6b60;
      --accent: #2e7d32;
      --accent-soft: #e8f5e9;
      --border: #dce5de;
      --yt: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding: 12px;
    }
    .app {
      max-width: 640px;
      margin: 0 auto;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: sticky;
      top: 8px;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .selector {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .item-btn {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.35;
    }
    .item-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .current-banner {
      background: var(--accent-soft);
      border: 1px solid #c8e6c9;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .current-name {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 4px 0;
      color: var(--accent);
    }
    .current-desc {
      font-size: 12px;
      color: var(--ink);
      margin: 0 0 8px 0;
    }
    .yt-btn {
      display: inline-block;
      background: var(--yt);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
    }
    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .bar {
      height: 6px;
      background: #e3ece5;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--accent);
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid #eef3ef;
    }
    .check-item:first-of-type { border-top: none; }
    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }
    .item-label { flex: 1; font-size: 14px; }
    .item-sub { display: block; font-size: 12px; color: var(--muted); }
    .done { text-decoration: line-through; color: var(--muted); }
    .step-list {
      margin: 0;
      padding-left: 20px;
    }
    .step-list li {
      margin-bottom: 10px;
      font-size: 14px;
    }
    .step-list li:last-child { margin-bottom: 0; }
    .memo-box {
      background: #f9fbf9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-top">
        <h1 class="title">🥗 サラダ6品（1品ずつ単独モード）</h1>
        <button class="btn" id="resetBtn" type="button">この品をリセット</button>
      </div>
      <div class="progress-row">
        <span id="progressText">0 / 0 (0%)</span>
        <span id="syncStatus">単独保存</span>
      </div>
      <div class="bar"><div class="bar-fill" id="progressBar"></div></div>
    </div>

    <div class="selector" id="recipeSelector"></div>

    <div class="current-banner">
      <h2 class="current-name" id="currentName"></h2>
      <p class="current-desc" id="currentDesc"></p>
      <a class="yt-btn" id="ytLink" href="#" target="_blank" rel="noopener">▶ YouTube動画を見る</a>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="recipe" type="button">📖 作り方・手順</button>
      <button class="tab" data-tab="shop" type="button">🛒 材料・買い出し</button>
      <button class="tab" data-tab="prep" type="button">⏱️ 段取り</button>
    </div>

    <div id="view-recipe"></div>
    <div id="view-shop" style="display:none;"></div>
    <div id="view-prep" style="display:none;"></div>

        ],
        steps: [
          "耐熱ボウルに冷凍海老を入れ、塩（小さじ1/3）、酒（大さじ1）、たっぷりの水を加え、ラップをせずに電子レンジ（600W）で3〜4分加熱して水気を切ります。",
          "別の容器に酢（大さじ1）、醤油（大さじ1）、砂糖（大さじ1）、ごま油（小さじ1）、ごま（小さじ1）を入れてよく混ぜ、タレを作ります。",
          "ボウルにアボカド、加熱した海老、半熟卵を入れてタレを回しかけます。",
          "卵を切るようにほぐしながら全体を軽く混ぜ合わせ、器に盛り付けます。"
        ],
        memo: "タレ配合：酢 大さじ1／醤油 大さじ1／砂糖 大さじ1／ごま油 小さじ1／ごま 小さじ1。"
      }
    ];

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            selectedId: parsed.selectedId || "r1",
            tab: parsed.tab || "recipe",
            checked: parsed.checked || {}
          };
        }
      } catch (e) {}
      return { selectedId: "r1", tab: "recipe", checked: {} };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function getCurrentRecipe() {
      return RECIPES.find(r => r.id === state.selectedId) || RECIPES[0];
    }

    function getCurrentItemIds(recipe) {
      return [...recipe.shop, ...recipe.prep].map(item => `${recipe.id}_${item.id}`);
    }

    function updateProgress() {
      const recipe = getCurrentRecipe();
      const ids = getCurrentItemIds(recipe);
      const total = ids.length;
      const done = ids.filter(fullId => !!state.checked[fullId]).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      document.getElementById("progressText").textContent = `${recipe.shortLabel}：${done} / ${total} (${pct}%)`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function renderSelector() {
      const el = document.getElementById("recipeSelector");
      el.innerHTML = RECIPES.map(r => `
        <button class="item-btn ${r.id === state.selectedId ? "active" : ""}" data-id="${r.id}" type="button">
          ${r.shortLabel}
        </button>
      `).join("");

      el.querySelectorAll(".item-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedId = btn.getAttribute("data-id");
          saveState();
          renderAll();
        });
      });
    }

    function renderBanner(recipe) {
      document.getElementById("currentName").textContent = recipe.name;
      document.getElementById("currentDesc").textContent = recipe.desc;
      document.getElementById("ytLink").href = recipe.ytUrl;
    }

    function renderRecipe(recipe) {
      const el = document.getElementById("view-recipe");
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">作り方手順（${recipe.shortLabel}）</h3>
          <ol class="step-list">
            ${recipe.steps.map(st => `<li>${st}</li>`).join("")}
          </ol>
          <div class="memo-box">
            <strong>味付け・調理メモ：</strong><br />
            ${recipe.memo}
          </div>
          <div style="margin-top:12px;">
            <a class="yt-btn" href="${recipe.ytUrl}" target="_blank" rel="noopener">▶ このレシピのYouTube動画を開く</a>
          </div>
        </div>
      `;
    }

    function renderCheckList(containerId, title, items, recipe) {
      const el = document.getElementById(containerId);
      el.innerHTML = `
        <div class="section">
          <h3 class="section-title">${title}（${recipe.shortLabel}）</h3>
          ${items.map(item => {
            const fullId = `${recipe.id}_${item.id}`;
            const checked = !!state.checked[fullId];
            return `
              <label class="check-item">
                <input type="checkbox" data-full-id="${fullId}" ${checked ? "checked" : ""} />
                <span class="item-label ${checked ? "done" : ""}">
                  ${item.name}
                  ${item.sub ? `<span class="item-sub">${item.sub}</span>` : ""}
                </span>
              </label>
            `;
          }).join("")}
        </div>
      `;

      el.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          const fullId = cb.getAttribute("data-full-id");
          state.checked[fullId] = cb.checked;
          saveState();
          const label = cb.nextElementSibling;
          if (label) label.classList.toggle("done", cb.checked);
          updateProgress();
        });
      });
    }

    function applyTab() {
      document.querySelectorAll(".tab").forEach(t => {
        t.classList.toggle("active", t.getAttribute("data-tab") === state.tab);
      });
      document.getElementById("view-recipe").style.display = state.tab === "recipe" ? "" : "none";
      document.getElementById("view-shop").style.display = state.tab === "shop" ? "" : "none";
      document.getElementById("view-prep").style.display = state.tab === "prep" ? "" : "none";
    }

    function renderAll() {
      const recipe = getCurrentRecipe();
      renderSelector();
      renderBanner(recipe);
      renderRecipe(recipe);
      renderCheckList("view-shop", "この1品に必要な材料・買い出し", recipe.shop, recipe);
      renderCheckList("view-prep", "この1品を作るときの段取り", recipe.prep, recipe);
      applyTab();
      updateProgress();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.tab = tab.getAttribute("data-tab");
        saveState();
        applyTab();
      });
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      const recipe = getCurrentRecipe();
      if (confirm(`${recipe.shortLabel} のチェックだけをリセットしますか？`)) {
        for (const fullId of getCurrentItemIds(recipe)) {
          delete state.checked[fullId];
        }
        saveState();
        renderAll();
      }
    });

    renderAll();
  </script>
</body>
</html>
