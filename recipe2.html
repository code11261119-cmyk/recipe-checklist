<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTubeレシピ・アプリビルダー＆キッチンコンシェルジュ（第2弾・6品）</title>
<style>
  :root {
    --primary: #0f766e;
    --primary-light: #ccfbf1;
    --primary-dark: #115e59;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 12px;
    padding-bottom: 40px;
  }
  .container { max-width: 640px; margin: 0 auto; }

  /* Header Card */
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    border: 1px solid var(--border);
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .app-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--primary-light);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .header-title-wrap { flex: 1; }
  .header-title {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .badge-count {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .action-row {
    display: flex;
    gap: 8px;
  }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .btn-primary {
    background: var(--primary);
    color: #fff;
    flex: 1;
  }
  .btn-outline {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    flex: 1;
  }
  .shop-badge {
    background: var(--primary-light);
    color: var(--primary-dark);
    font-size: 12px;
    padding: 1px 7px;
    border-radius: 999px;
  }

  /* Search & Controls */
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    background: #f8fafc;
    margin-bottom: 12px;
  }
  .servings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 12px;
  }
  .servings-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .serving-btns {
    display: flex;
    gap: 4px;
    flex: 1;
    justify-content: flex-end;
  }
  .serving-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text);
  }
  .serving-btn.active {
    background: #0284c7;
    color: #fff;
    border-color: #0284c7;
  }
  .tag-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .tag-scroll::-webkit-scrollbar { display: none; }
  .tag-pill {
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
  }
  .tag-pill.active {
    background: #0284c7;
    color: #fff;
    border-color: #0284c7;
  }

  /* Recipe Card */
  .recipe-card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-top: 4px solid var(--primary);
  }
  .recipe-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .recipe-title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .recipe-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }
  .r-tag {
    font-size: 11px;
    background: #f0fdfa;
    color: var(--primary-dark);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
  }
  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin: 10px 0 6px;
  }
  .ing-list {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .ing-item {
    font-size: 12px;
    background: #f8fafc;
    padding: 6px 8px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    gap: 4px;
  }
  .ing-amt { font-weight: 700; color: var(--primary-dark); white-space: nowrap; }
  .step-list {
    padding-left: 18px;
    font-size: 13px;
    color: #334155;
  }
  .step-list li { margin-bottom: 4px; }

  /* Shopping List Modal (Optimized for Maximum List Space) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    flex-direction: column;
    z-index: 1000;
    padding: 8px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Compact Modal Header + Accordion Filter */
  .modal-top {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #f8fafc;
    flex-shrink: 0;
  }
  .modal-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .modal-title {
    font-size: 15px;
    font-weight: 800;
  }
  .copy-mini-btn {
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
  }

  /* Accordion Toggle Bar */
  .filter-toggle {
    margin-top: 8px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .filter-panel {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .filter-panel.open { display: block; }
  .filter-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .filter-links button {
    background: none;
    border: none;
    color: var(--primary);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    margin-left: 8px;
  }
  .chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 140px;
    overflow-y: auto;
  }
  .recipe-chip {
    font-size: 11px;
    font-weight: 700;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--primary);
    background: #fff;
    color: var(--primary);
    cursor: pointer;
  }
  .recipe-chip.selected {
    background: var(--primary);
    color: #fff;
  }

  /* Wide Scrollable Shopping List Body */
  .modal-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    -webkit-overflow-scrolling: touch;
  }
  .shop-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    background: #fff;
    cursor: pointer;
  }
  .shop-item.checked {
    background: #f8fafc;
    opacity: 0.55;
  }
  .shop-item.checked .shop-name {
    text-decoration: line-through;
  }
  .shop-left {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex: 1;
  }
  .shop-checkbox {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: var(--primary);
    flex-shrink: 0;
  }
  .shop-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .shop-sources {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .shop-amount {
    font-size: 13px;
    font-weight: 800;
    color: var(--primary-dark);
    white-space: nowrap;
  }

  /* Compact Modal Footer */
  .modal-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .uncheck-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .close-btn {
    background: #1e293b;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  /* Add Recipe Modal */
  .add-box {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    margin: auto;
    width: 100%;
    max-width: 500px;
  }
  .add-box textarea {
    width: 100%;
    height: 120px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    margin: 10px 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header-top">
      <div class="app-icon">🥗</div>
      <div class="header-title-wrap">
        <div class="header-title">
          <span>YouTubeレシピ・アプリビルダー</span>
          <span class="badge-count" id="totalRecipeBadge">6品収録</span>
        </div>
        <div class="header-sub">検索・分量計算・買い物リスト統合・キッチン管理</div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn btn-primary" onclick="openAddModal()">＋ レシピ追加</button>
      <button class="btn btn-outline" onclick="openShopModal()">
        🛒 買い物リスト <span class="shop-badge" id="shopCountBadge">0</span>
      </button>
    </div>
  </div>

  <div class="card">
    <input type="text" id="searchInput" class="search-input" placeholder="食材・調味料・調理法で横断検索（例：海老、舞茸、レンジ）" oninput="renderRecipes()">
    <div class="servings-row">
      <span class="servings-label">👥 分量計算:</span>
      <div class="serving-btns">
        <button class="serving-btn" onclick="setServings(1, this)">1人分</button>
        <button class="serving-btn active" onclick="setServings(2, this)">2人分</button>
        <button class="serving-btn" onclick="setServings(3, this)">3人分</button>
        <button class="serving-btn" onclick="setServings(4, this)">4人分</button>
      </div>
    </div>
    <div class="tag-scroll" id="tagBar"></div>
  </div>

  <div id="recipeList"></div>
</div>

<!-- 買い物リストモーダル（折りたたみフィルター搭載・リスト最大化設計） -->
<div class="modal-overlay" id="shopModal">
  <div class="modal-box">
    <div class="modal-top">
      <div class="modal-header-row">
        <span class="modal-title">🛒 買い物リスト（<span id="modalServingsLabel">2人分</span>）</span>
        <button class="copy-mini-btn" id="copyBtn" onclick="copyShoppingList()">📋 リストをコピー</button>
      </div>

      <button class="filter-toggle" onclick="toggleFilterPanel()">
        <span id="filterSummaryText">対象レシピを絞り込む（6 / 6品 選択中）</span>
        <span id="filterArrow">▼ 開く</span>
      </button>

      <div class="filter-panel" id="filterPanel">
        <div class="filter-actions">
          <span>タップでON/OFF（共通食材は自動統合）</span>
          <div class="filter-links">
            <button onclick="selectAllRecipes(true)">全選択</button>
            <button onclick="selectAllRecipes(false)">全解除</button>
          </div>
        </div>
        <div class="chip-wrap" id="recipeChipWrap"></div>
      </div>
    </div>

    <div class="modal-body" id="shoppingListContainer"></div>

    <div class="modal-footer">
      <button class="uncheck-btn" onclick="clearCheckedItems()">購入済みチェックを外す</button>
      <button class="close-btn" onclick="closeShopModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- 簡易レシピ追加モーダル -->
<div class="modal-overlay" id="addModal">
  <div class="add-box">
    <div class="modal-title">＋ レシピを追加（タイトルと材料）</div>
    <p style="font-size:12px;color:#64748b;margin-top:4px;">1行目にレシピ名、2行目以降に「食材名 数量 単位」を入力してください。</p>
    <textarea id="quickRecipeInput" placeholder="例：&#10;トマトとツナの冷製サラダ&#10;トマト 2 個&#10;ツナ缶 1 缶&#10;オリーブオイル 1 大さじ"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-outline" onclick="closeAddModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveQuickRecipe()">追加する</button>
    </div>
  </div>
</div>

let currentServings = 2;
let selectedTag = "すべて";
let selectedRecipeIds = new Set(recipes.map(r => r.id));
let checkedItems = new Set(JSON.parse(localStorage.getItem("yt_checked_v2") || "[]"));
let isFilterOpen = false;

function saveState() {
  localStorage.setItem("yt_recipes_v2", JSON.stringify(recipes));
  localStorage.setItem("yt_checked_v2", JSON.stringify([...checkedItems]));
}

function formatAmount(baseAmt, baseServings, targetServings) {
  const val = (baseAmt / baseServings) * targetServings;
  return Number.isInteger(val) ? val : Math.round(val * 10) / 10;
}

function renderTags() {
  const tagCounts = { "すべて": recipes.length };
  recipes.forEach(r => r.tags.forEach(t => {
    tagCounts[t] = (tagCounts[t] || 0) + 1;
  }));
  const bar = document.getElementById("tagBar");
  bar.innerHTML = Object.entries(tagCounts).map(([tag, count]) => `
    <button class="tag-pill ${selectedTag === tag ? 'active' : ''}" onclick="selectTag('${tag}')">
      ${tag === 'すべて' ? `すべて (${count})` : `#${tag}`}
    </button>
  `).join("");
}

function selectTag(tag) {
  selectedTag = tag;
  renderTags();
  renderRecipes();
}

function setServings(num, btn) {
  currentServings = num;
  document.querySelectorAll(".serving-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderRecipes();
  updateShopBadge();
}

function renderRecipes() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = recipes.filter(r => {
    const matchTag = selectedTag === "すべて" || r.tags.includes(selectedTag);
    const haystack = [r.title, ...r.tags, ...r.ingredients.map(i => i.name)].join(" ").toLowerCase();
    const matchQuery = !q || haystack.includes(q);
    return matchTag && matchQuery;
  });

  document.getElementById("totalRecipeBadge").textContent = `${recipes.length}品収録`;
  const list = document.getElementById("recipeList");
  if (filtered.length === 0) {
    list.innerHTML = `<div class="card" style="text-align:center;color:#64748b;">該当するレシピがありません</div>`;
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="recipe-card">
      <div class="recipe-meta">
        <span>▶ ${r.channel} ・ ⏱ ${r.time}</span>
      </div>
      <div class="recipe-title">${r.title}</div>
      <div class="recipe-tags">
        ${r.tags.map(t => `<span class="r-tag">#${t}</span>`).join("")}
      </div>
      <div class="section-label">材料（${currentServings}人分）</div>
      <ul class="ing-list">
        ${r.ingredients.map(i => `
          <li class="ing-item">
            <span>${i.name}</span>
            <span class="ing-amt">${formatAmount(i.amount, r.baseServings, currentServings)}${i.unit}</span>
          </li>
        `).join("")}
      </ul>
      <div class="section-label">作り方</div>
      <ol class="step-list">
        ${r.steps.map(s => `<li>${s}</li>`).join("")}
      </ol>
    </div>
  `).join("");
}
